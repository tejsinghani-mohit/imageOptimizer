{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Available Routes</h1>
    <table class="table">
        <thead>
            <tr>
                <th>URL</th>
                <th>Endpoint</th>
                <th>Methods</th>
            </tr>
        </thead>
        <tbody>
            {% for route in routes %}
            <tr>
                <td>{{ route.url }}</td>
                <td>{{ route.endpoint }}</td>
                <td>{{ route.methods }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
